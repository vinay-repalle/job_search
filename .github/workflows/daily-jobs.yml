name: Daily job alerts

on:
  schedule:
    - cron: "30 2 * * *"          # 02:30 UTC = 08:00 IST, every day (GitHub may start it a few minutes late)
  workflow_dispatch:               # "Run workflow" button on the Actions tab
    inputs:
      max_age_days:
        description: "Look back this many days (use 7 for the very first run)"
        required: false
        default: "3"
      send_digest:
        description: "Send the daily email digest"
        type: boolean
        default: true
  push:                            # website / workflow edits → redeploy only (no job fetch, no message)
    branches: [main]
    paths: ["docs/**", "!docs/data/**", ".github/workflows/daily-jobs.yml"]

permissions:
  contents: write                  # commit docs/data/jobs.json
  pages: write                     # publish the website
  id-token: write

concurrency:
  group: daily-jobs
  cancel-in-progress: false

jobs:
  # fetch → build → deploy → email. "alert" runs only if one of the first three fails.
  # On a push, fetch still runs but skips its steps, so the jobs after it are never skipped.
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Website-only push — skip the job search
        if: github.event_name == 'push'
        run: echo "Website/workflow edit pushed — redeploying the site only (no job search, no alerts)."

      - uses: actions/checkout@v5
        if: github.event_name != 'push'

      - uses: actions/setup-python@v6
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: github.event_name != 'push'

      - name: Fetch and filter jobs
        if: github.event_name != 'push'
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          MAX_AGE_DAYS: ${{ inputs.max_age_days }}
        run: python scripts/fetch_jobs.py

      - name: Save jobs.json to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Jobs update $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M') IST"
          git pull --rebase origin main
          git push

  build:
    needs: fetch                   # on a push, fetch finishes in seconds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main                # includes the jobs.json committed above

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # Kept apart from "build": deploying in the same job as the upload failed with "No artifacts named github-pages".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  email:
    needs: [fetch, deploy]         # waits for the website, but is sent even if the website update failed
    if: ${{ !cancelled() && needs.fetch.result == 'success' && (github.event_name == 'schedule' || inputs.send_digest) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send the daily email digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
        run: python scripts/notify.py

  alert:
    needs: [fetch, build, deploy, email]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Email a failure alert (to EMAIL_BCC only)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}
          REASON: >-
            ${{ needs.fetch.result == 'failure' && 'the job search failed'
            || needs.email.result == 'failure' && 'the daily email failed'
            || 'the website update failed' }}
        run: python scripts/notify.py --failure "$REASON"
