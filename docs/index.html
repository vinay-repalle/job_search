<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QA Jobs</title>
  <meta name="description" content="Daily QA, App Support and CSV/Validation openings in Hyderabad and remote India.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18191c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QA Jobs">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="jobs">
  <header class="top" id="top">
    <div class="top-row">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="34" height="34">
        <div>
          <h1>QA Jobs</h1>
          <p id="updated" class="muted">Loading…</p>
        </div>
      </div>

      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="jobs" aria-selected="true">
          <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 7V5.5A1.5 1.5 0 0 1 10 4h4a1.5 1.5 0 0 1 1.5 1.5V7M3 12.5h18" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>
          <span class="tab-label">Jobs <span id="cJobs" class="tab-count"></span></span>
        </button>
        <button role="tab" data-tab="saved" aria-selected="false">
          <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.8 2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.6l-5 2.6.9-5.6-4-3.9 5.6-.8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span>
          <span class="tab-label">Saved <span id="cSaved" class="tab-count"></span></span>
        </button>
        <button role="tab" data-tab="applied" aria-selected="false">
          <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 12.3 2.7 2.7L16 9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="tab-label">Applied <span id="cApplied" class="tab-count"></span></span>
        </button>
        <button role="tab" data-tab="details" aria-selected="false">
          <span class="tab-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10.8" r="2.1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.9 16.2c.6-1.5 1.7-2.3 3.1-2.3s2.5.8 3.1 2.3M14.5 10h3.5M14.5 13.6h3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
          <span class="tab-label">My details <span class="tab-count"></span></span>
        </button>
      </nav>

      <div class="top-actions">
        <button id="refreshBtn" class="round-btn" aria-label="Check for new jobs" title="Check for new jobs">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4.5V11h-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="filterBtn" class="pill-btn" aria-expanded="false" aria-controls="filters">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
          Filters<span id="filterCount" class="count" hidden></span>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside id="filters" class="filters" aria-labelledby="filtersTitle">
      <div class="sheet-head" id="sheetHead">
        <span class="grab" aria-hidden="true"></span>
        <h2 id="filtersTitle">Filters</h2>
        <button id="resetFilters" class="link-btn">Reset</button>
        <button id="closeFilters" class="icon-only sheet-only" aria-label="Close filters">✕</button>
      </div>
      <div class="sheet-body">
        <div class="f-group">
          <h3>Found</h3>
          <div class="chips" data-filter="age" data-single>
            <button data-v="1">Today</button><button data-v="3">3 days</button><button data-v="7">7 days</button><button data-v="0">All</button>
          </div>
        </div>
        <div class="f-group">
          <h3>Role</h3>
          <div class="chips" data-filter="groups">
            <button data-v="qa">QA / Testing</button><button data-v="support">App Support</button><button data-v="validation">CSV / Validation</button>
          </div>
        </div>
        <div class="f-group">
          <h3>Work mode</h3>
          <div class="chips" data-filter="modes">
            <button data-v="Remote">Remote</button><button data-v="Hybrid">Hybrid</button><button data-v="Office">Office</button><button data-v="Not stated">Not stated</button>
          </div>
        </div>
        <div class="f-group">
          <h3>Experience asked (max)</h3>
          <div class="chips" data-filter="exp" data-single>
            <button data-v="99">Any</button><button data-v="1">≤ 1 yr</button><button data-v="2">≤ 2 yrs</button><button data-v="3">≤ 3 yrs</button><button data-v="4">≤ 4 yrs</button>
          </div>
        </div>
        <div class="f-group">
          <h3>Source</h3>
          <div class="chips" data-filter="trust" data-single>
            <button data-v="all">All</button><button data-v="trusted">Trusted only</button><button data-v="company">Company sites</button>
          </div>
        </div>
        <div class="f-group toggles">
          <label class="toggle"><input type="checkbox" id="goodOnly"> <span>Only ★ good matches for my skills</span></label>
          <label class="toggle"><input type="checkbox" id="hideShift"> <span>Hide night / rotational shift jobs</span></label>
          <label class="toggle"><input type="checkbox" id="showHidden"> <span>Show jobs I marked “Not interested”</span></label>
        </div>
      </div>
      <div class="sheet-foot sheet-only">
        <button id="doneFilters" class="btn primary block">Show jobs</button>
      </div>
    </aside>

    <div class="main">
      <div id="install" class="install" hidden>
        <div>
          <strong>Install this app</strong>
          <p id="installText" class="muted"></p>
        </div>
        <div class="install-actions">
          <button id="installBtn" class="btn primary small" hidden>Install</button>
          <button id="installClose" class="icon-only" aria-label="Dismiss">✕</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search title, company, skill…" autocomplete="off" enterkeyhint="search" aria-label="Search jobs">
        </div>
        <p id="summary" class="summary muted"></p>
      </div>

      <div id="notice" class="notice" hidden></div>
      <main id="list" aria-live="polite"></main>

      <footer class="foot">
        <p class="muted">Your Saved / Applied list, notes and details are stored on this device only.</p>
        <div class="foot-actions">
          <button id="exportBtn" class="btn ghost small">Back up list</button>
          <label class="btn ghost small">Restore<input id="importFile" type="file" accept="application/json" hidden></label>
        </div>
        <p class="muted tiny">Tip: a real employer never asks you to pay a fee.</p>
      </footer>
    </div>
  </div>

  <div id="backdrop" class="backdrop" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
